    table: example_tabular_sleep
    type: table_info
    include_in_cross_dataset: true
    content: >
      TODO: describe row granularity, units, date meaning, and duplicate policy.
  - id: example_tabular_sleep_scoring
    table: example_tabular_sleep
    type: scoring_rule
    include_in_cross_dataset: true
